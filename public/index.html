const API_URL = window.location.hostname === 'localhost' ? 'http://localhost:3000/api' : '/api';

const api = {
  async request(endpoint, options = {}) {
    try {
      const res = await fetch(`${API_URL}${endpoint}`, {
        ...options,
        headers: { 
          'Content-Type': 'application/json', 
          ...options.headers 
        }
      });
      const data = await res.json();
      return data;
    } catch (error) {
      console.error('API Error:', error);
      return { error: 'Ошибка подключения к серверу' };
    }
  },
  
  // Методы аутентификации
  register: (username, password, type, agreedToTerms) => 
    api.request('/register', { 
      method: 'POST', 
      body: JSON.stringify({ username, password, type, agreedToTerms }) 
    }),
  
  login: (username, password) => 
    api.request('/login', { 
      method: 'POST', 
      body: JSON.stringify({ username, password }) 
    }),
  
  getProfile: (token) => 
    api.request('/profile', { 
      headers: { 'Authorization': `Bearer ${token}` } 
    }),
  
  // Методы работы с заданиями
  getTasks: (filters = {}) => {
    const params = new URLSearchParams();
    Object.entries(filters).forEach(([key, value]) => {
      if (value) params.append(key, value);
    });
    return api.request('/tasks?' + params.toString());
  },
  
  createTask: (token, data) => 
    api.request('/tasks', { 
      method: 'POST', 
      headers: { 'Authorization': `Bearer ${token}` }, 
      body: JSON.stringify(data) 
    }),
  
  deleteTask: (token, taskId) => 
    api.request(`/tasks/${taskId}`, { 
      method: 'DELETE', 
      headers: { 'Authorization': `Bearer ${token}` } 
    }),
  
  getMyTasks: (token) => 
    api.request('/tasks/my', { 
      headers: { 'Authorization': `Bearer ${token}` } 
    }),
  
  // Методы работы с откликами
  applyToTask: (token, taskId) => 
    api.request(`/tasks/${taskId}/apply`, { 
      method: 'POST', 
      headers: { 'Authorization': `Bearer ${token}` } 
    }),
  
  getTaskApplications: (token, taskId) => 
    api.request(`/tasks/${taskId}/applications`, { 
      headers: { 'Authorization': `Bearer ${token}` } 
    }),
  
  getMyApplications: (token) => 
    api.request('/applications/my', { 
      headers: { 'Authorization': `Bearer ${token}` } 
    }),
  
  approveApplication: (token, id) => 
    api.request(`/applications/${id}/accept`, { 
      method: 'POST', 
      headers: { 'Authorization': `Bearer ${token}` } 
    }),
  
  rejectApplication: (token, id) => 
    api.request(`/applications/${id}/reject`, { 
      method: 'POST', 
      headers: { 'Authorization': `Bearer ${token}` } 
    }),
  
  confirmWork: (token, id) => 
    api.request(`/applications/${id}/confirm-work`, { 
      method: 'POST', 
      headers: { 'Authorization': `Bearer ${token}` } 
    }),
  
  rateWorker: (token, id, rating) => 
    api.request(`/applications/${id}/rate-worker`, { 
      method: 'POST', 
      headers: { 'Authorization': `Bearer ${token}` }, 
      body: JSON.stringify({ rating }) 
    }),
  
  rateEmployer: (token, id, rating) => 
    api.request(`/applications/${id}/rate-employer`, { 
      method: 'POST', 
      headers: { 'Authorization': `Bearer ${token}` }, 
      body: JSON.stringify({ rating }) 
    }),
  
  claimPayment: (token, id) => 
    api.request(`/applications/${id}/claim-payment`, { 
      method: 'POST', 
      headers: { 'Authorization': `Bearer ${token}` } 
    }),
  
  // Методы работы с балансом
  addBalance: (token, amount) => 
    api.request('/balance/add', { 
      method: 'POST', 
      headers: { 'Authorization': `Bearer ${token}` }, 
      body: JSON.stringify({ amount }) 
    }),
  
  withdrawBalance: (token) => 
    api.request('/balance/withdraw', { 
      method: 'POST', 
      headers: { 'Authorization': `Bearer ${token}` } 
    }),
  
  buyPremium: (token) => 
    api.request('/premium/buy', { 
      method: 'POST', 
      headers: { 'Authorization': `Bearer ${token}` } 
    }),
  
  // Остальные методы
  getLeaderboard: () => 
    api.request('/leaderboard'),
  
  donate: (token, amount) => 
    api.request('/charity/donate', { 
      method: 'POST', 
      headers: { 'Authorization': `Bearer ${token}` }, 
      body: JSON.stringify({ amount }) 
    }),
  
  // Методы чата
  getChat: (token, taskId) => 
    api.request(`/chat/${taskId}`, { 
      headers: { 'Authorization': `Bearer ${token}` } 
    }),
  
  sendMessage: (token, taskId, text) => 
    api.request(`/chat/${taskId}`, { 
      method: 'POST', 
      headers: { 'Authorization': `Bearer ${token}` }, 
      body: JSON.stringify({ text }) 
    }),
  
  // Методы поддержки
  getSupportMessages: (token) => 
    api.request('/support/my-messages', { 
      headers: { 'Authorization': `Bearer ${token}` } 
    }),
  
  sendSupport: (token, text) => 
    api.request('/support/send', { 
      method: 'POST', 
      headers: { 'Authorization': `Bearer ${token}` }, 
      body: JSON.stringify({ text }) 
    }),
  
  // Методы админ-панели
  adminLogin: (password) => 
    api.request('/admin/login', { 
      method: 'POST', 
      body: JSON.stringify({ password }) 
    }),
  
  getTickets: () => 
    api.request('/admin/support-tickets'),
  
  getTicketMessages: (userId) => 
    api.request(`/admin/support-messages/${userId}`),
  
  adminReply: (userId, text) => 
    api.request('/admin/support-reply', { 
      method: 'POST', 
      body: JSON.stringify({ userId, text }) 
    })
};

function TaskPlatform() {

  // Трудовые договоры
  const workerAgreement = `ТРУДОВОЙ ДОГОВОР ДЛЯ РАБОТНИКА

  const employerAgreement = `ТРУДОВОЙ ДОГОВОР ДЛЯ РАБОТОДАТЕЛЯ

1. ОБЩИЕ ПОЛОЖЕНИЯ
Работодатель обязуется создавать задания в соответствии с правилами платформы и предоставлять точное описание работы.

2. ПРАВА И ОБЯЗАННОСТИ
Работодатель имеет право:
- Создавать задания
- Выбирать исполнителей
- Оценивать качество выполненной работы

Работодатель обязуется:
- Предоставлять точное описание задания
- Указывать реальные сроки

- Оплачивать задания согласно установленной стоимости

3. ОПЛАТА
10 Я баллов = 1 рубль
Баллы списываются при создании задания

4. ПОДПИСКА ЯвДеле+
За 10000 Я баллов можно активировать премиум подписку для установки минимального рейтинга исполнителей.

Нажимая "Согласен", вы подтверждаете согласие с условиями.`;


  // ==================================================================================================
  // EFFECTS - АВТОМАТИЧЕСКАЯ ЗАГРУЗКА ДАННЫХ
  // ==================================================================================================
  
  // Загрузка профиля при входе
  useEffect(() => {
    if (token && !isAdmin) {
      loadProfile();
      loadTasks();
    }
  }, [token]);

  // Перезагрузка заданий при изменении фильтров
  useEffect(() => {
    if (token) {
      loadTasks();
    }
  }, [selectedCategory, selectedDifficulty, minPayment, searchQuery]);

  // Загрузка откликов при переходе на вкладку
  useEffect(() => {
    if (token && currentView === 'myApplications') {
      loadMyApplications();
    }
  }, [currentView, token]);
  useEffect(() => {
    if (token && user && user.type === 'employer' && currentView === 'myTasks') {
      loadMyTasks();
    }
  }, [currentView, token, user]);


  // Автообновление чата
  useEffect(() => {
    if (activeChat) {
      loadChat();
      const interval = setInterval(loadChat, 3000);
      return () => clearInterval(interval);
    }
  }, [activeChat]);

  // Автоскролл чата
  useEffect(() => {
    if (chatRef.current) {
      chatRef.current.scrollTop = chatRef.current.scrollHeight;
    }
  }, [chatMessages]);

  // Автообновление поддержки
  useEffect(() => {
    if (showSupport && token) {
      loadSupportMessages();
      const interval = setInterval(loadSupportMessages, 3000);
      return () => clearInterval(interval);
    }
  }, [showSupport, token]);

  // Автоскролл поддержки
  useEffect(() => {
    if (supportRef.current) {
      supportRef.current.scrollTop = supportRef.current.scrollHeight;
    }
  }, [supportMessages]);

  // Автообновление тикетов админа
  useEffect(() => {
    if (isAdmin) {
      loadAdminTickets();
      const interval = setInterval(loadAdminTickets, 5000);
      return () => clearInterval(interval);
    }
  }, [isAdmin]);

  // Автообновление сообщений админа
  useEffect(() => {
    if (adminActiveTicket) {
      loadAdminMessages();
      const interval = setInterval(loadAdminMessages, 3000);
      return () => clearInterval(interval);
    }
  }, [adminActiveTicket]);

  // Автоскролл админского чата

    if (adminRef.current) {
      adminRef.current.scrollTop = adminRef.current.scrollHeight;
    }

  // ==================================================================================================

        setUser(data);

      console.error('Ошибка загрузки профиля:', err);

  const loadTasks = async () => {
    try {

      if (selectedCategory !== 'all') filters.category = selectedCategory;
      if (selectedDifficulty !== 'all') filters.difficulty = selectedDifficulty;
      if (minPayment > 0) filters.minPayment = minPayment;
      if (searchQuery) filters.search = searchQuery;

                    value={newTask.difficulty}
                    onChange={(e) => setNewTask({...newTask, difficulty: parseInt(e.target.value)})}
                    className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none"
                  >
                    {[1,2,3,4,5].map(d => (
                      <option key={d} value={d}>{'⭐'.repeat(d)}</option>
                    ))}
                  </select>
                </div>
              </div>
              
              {user.has_premium && (
                <div>
                  <label className="block text-sm font-medium mb-2">
                    ⭐ Минимальный рейтинг исполнителя
                  </label>
                  <input
                    type="number"
                    value={newTask.minRating}
                    onChange={(e) => setNewTask({...newTask, minRating: parseFloat(e.target.value) || 0})}
                    className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none"
                    min="0"
                    max="5"
                    step="0.1"
                  />
                  <p className="text-xs text-gray-500 mt-1">Доступно только с ЯвДеле+</p>
                </div>
              )}
              
              <div>
                <label className="block text-sm font-medium mb-2">Описание</label>
                <textarea
                  value={newTask.description}
                  onChange={(e) => setNewTask({...newTask, description: e.target.value})}
                  className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none"
                  rows="4"
                  placeholder="Подробное описание задания..."
                />
              </div>
              
              <div>
                <label className="block text-sm font-medium mb-2">Требования (необязательно)</label>
                <textarea
                  value={newTask.requirements}
                  onChange={(e) => setNewTask({...newTask, requirements: e.target.value})}
                  className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none"
                  rows="2"
                  placeholder="Требования к исполнителю..."
                />
              </div>
              
              <div>
                <label className="block text-sm font-medium mb-2">Контакты</label>
                <input
                  type="text"
                  value={newTask.contacts}
                  onChange={(e) => setNewTask({...newTask, contacts: e.target.value})}
                  className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none"
                  placeholder="Телефон, email и т.д."
                />
              </div>
              
              <div className="bg-yellow-50 border border-yellow-200 rounded-lg p-4">
                <p className="text-sm text-yellow-800">
                  <strong>Внимание:</strong> С вашего баланса будет списано {newTask.payment} Я баллов ({(newTask.payment / 10).toFixed(0)} ₽)
                </p>
              </div>
            </div>
            
            <div className="flex gap-3 mt-6">
              <button
                onClick={createTask}
                disabled={!newTask.title || !newTask.description || newTask.payment < 1000 || user.balance < newTask.payment}
                className="flex-1 bg-green-600 text-white py-3 rounded-lg hover:bg-green-700 transition font-semibold disabled:bg-gray-300 disabled:cursor-not-allowed"
              >
                Создать задание
              </button>
              <button
                onClick={() => {
                  setShowCreateTask(false);
                  setError('');
                }}
                className="flex-1 bg-gray-300 py-3 rounded-lg hover:bg-gray-400 transition"
              >
                Отмена
              </button>
            </div>
          </div>
        </div>
      )}

      {/* MODAL: BUY BALANCE - Пополнение баланса */}
      {showBuyBalanceModal && (
        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
          <div className="bg-white rounded-lg p-6 max-w-md w-full">
            <h2 className="text-2xl font-bold mb-4">Пополнить баланс</h2>
            
            <div className="space-y-4">
              <div>
                <label className="block text-sm font-medium mb-2">Сумма (Я баллы)</label>
                <input
                  type="number"
                  value={buyAmount}
                  onChange={(e) => setBuyAmount(parseInt(e.target.value) || 0)}
                  className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none"
                  min="1000"
                  step="500"
                />
                <p className="text-sm text-gray-600 mt-2">= {(buyAmount / 10).toFixed(0)} рублей</p>
              </div>
              
              <div className="grid grid-cols-3 gap-2">
                {[5500, 11000, 22000].map(amount => (
                  <button
                    key={amount}
                    onClick={() => setBuyAmount(amount)}
                    className="bg-gray-100 hover:bg-gray-200 p-3 rounded-lg transition"
                  >
                    <div className="font-bold">{amount} Я</div>
                    <div className="text-xs text-gray-600">{(amount / 10).toFixed(0)} ₽</div>
                  </button>
                ))}
              </div>
              
              <div className="bg-blue-50 border border-blue-200 rounded-lg p-4">
                <p className="text-sm text-blue-800">
                  💡 10 Я баллов = 1 рубль
                </p>
              </div>
            </div>
            
            <div className="flex gap-3 mt-6">
              <button
                onClick={buyBalance}
                disabled={buyAmount < 1000}
                className="flex-1 bg-green-600 text-white py-3 rounded-lg hover:bg-green-700 transition font-semibold disabled:bg-gray-300"
              >
                Пополнить
              </button>
              <button
                onClick={() => setShowBuyBalanceModal(false)}
                className="flex-1 bg-gray-300 py-3 rounded-lg hover:bg-gray-400 transition"
              >
                Отмена
              </button>
            </div>
          </div>
        </div>
      )}


      {/* MODAL: CHAT - Чат между работником и работодателем */}
      {activeChat && (
        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
          <div className="bg-white rounded-lg max-w-2xl w-full max-h-[80vh] flex flex-col">
            <div className="p-4 border-b flex justify-between items-center">
              <h3 className="font-bold text-lg">💬 Чат: {activeChat.task_title}</h3>
              <button onClick={() => setActiveChat(null)} className="text-gray-500 hover:text-gray-700">
                <Icon name="x" />
              </button>
            </div>
            
            <div ref={chatRef} className="flex-1 overflow-y-auto p-4 space-y-3 bg-gray-50">
              {chatMessages.map((msg, i) => (
                <div key={i} className={`flex ${msg.sender_id === user.id ? 'justify-end' : 'justify-start'}`}>
                  <div className={`max-w-xs rounded-lg p-3 ${
                    msg.sender_id === user.id 
                      ? 'bg-green-600 text-white' 
                      : 'bg-white shadow'
                  }`}>
                    <p className="text-xs opacity-75 mb-1">{msg.sender_name}</p>
                    <p>{msg.text}</p>
                    <p className="text-xs opacity-75 mt-1">
                      {new Date(msg.created_at).toLocaleTimeString('ru-RU')}
                    </p>
                  </div>
                </div>
              ))}
            </div>
            
            <div className="p-4 border-t flex gap-2">
              <input
                type="text"
                value={msgInput}
                onChange={(e) => setMsgInput(e.target.value)}
                onKeyPress={(e) => e.key === 'Enter' && sendMsg()}
                placeholder="Введите сообщение..."
                className="flex-1 p-3 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none"
              />
              <button 
                onClick={sendMsg} 
                className="bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700 transition"
              >
                <Icon name="send" />
              </button>
            </div>
          </div>
        </div>
      )}

      {/* MODAL: RATING - Оценка работника/работодателя */}
      {showRating && (
        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
          <div className="bg-white rounded-lg p-6 max-w-md w-full">
            <h2 className="text-2xl font-bold mb-4 text-center">
              {showRating.type === 'worker' ? 'Оцените работника' : 'Оцените заказчика'}
            </h2>
            
            <div className="flex justify-center gap-2 mb-6">
              {[1,2,3,4,5].map(rating => (
                <button
                  key={rating}
                  onClick={() => setSelectedRating(rating)}
                  className={`text-4xl transition ${
                    rating <= selectedRating ? 'text-yellow-400' : 'text-gray-300'
                  }`}
                >
                  ⭐
                </button>
              ))}
            </div>
            
            <div className="flex gap-3">
              <button
                onClick={submitRating}
                className="flex-1 bg-green-600 text-white py-3 rounded-lg hover:bg-green-700 transition font-semibold"
              >
                Отправить оценку
              </button>
              <button
                onClick={() => {
                  setShowRating(null);
                  setSelectedRating(5);
                }}
                className="flex-1 bg-gray-300 py-3 rounded-lg hover:bg-gray-400 transition"
              >
                Отмена
              </button>
            </div>
          </div>
        </div>
      )}

      {/* MODAL: LEADERBOARD - Таблица лидеров */}
      {showLeaderboard && (
        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
          <div className="bg-white rounded-lg p-6 max-w-2xl w-full max-h-[80vh] overflow-y-auto">
            <div className="flex justify-between items-center mb-6">
              <h2 className="text-2xl font-bold">🏆 Топ пользователей</h2>
              <button 
                onClick={() => setShowLeaderboard(false)} 
                className="text-gray-500 hover:text-gray-700"
              >
                <Icon name="x" />
              </button>
            </div>
            
            <div className="space-y-3">
              {leaderboard.map((user, i) => (
                <div 
                  key={i} 
                  className={`flex items-center gap-4 p-4 rounded-lg ${
                    i < 3 
                      ? 'bg-gradient-to-r from-yellow-50 to-orange-50 border-2 border-yellow-300' 
                      : 'bg-gray-50'
                  }`}
                >
                  <div className="text-3xl font-bold w-12 text-center">
                    {i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i + 1}.`}
                  </div>
                  <div className="flex-1">
                    <p className="font-bold">{user.username}</p>
                    <p className="text-sm text-gray-600">
                      {user.type === 'worker' ? '👷 Рабочий' : '👔 Работодатель'}
                    </p>
                  </div>
                  <div className="text-right">
                    <div className="flex items-center gap-1 text-yellow-600 font-bold">
                      <Star className="w-5 h-5" />
                      {user.rating.toFixed(2)}
                    </div>
                    <p className="text-xs text-gray-500">{user.completed_tasks} заданий</p>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* MODAL: DONATE - Благотворительность */}
      {showDonate && (
        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
          <div className="bg-white rounded-lg p-6 max-w-md w-full">
            <h2 className="text-2xl font-bold mb-4 text-center">❤️ Благотворительность</h2>
            
            <p className="text-gray-600 mb-4 text-center">
              Хотите помочь нуждающимся? Пожертвуйте часть заработка на благотворительность.
            </p>
            
            <div className="mb-4">
              <label className="block text-sm font-medium mb-2">Сумма пожертвования</label>
              <input
                type="number"
                value={donateAmount}
                onChange={(e) => setDonateAmount(parseInt(e.target.value) || 0)}
                className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none"
                min="0"
                step="100"
              />
              <p className="text-sm text-gray-600 mt-2">= {(donateAmount / 10).toFixed(0)} рублей</p>
            </div>
            
            <div className="grid grid-cols-4 gap-2 mb-4">
              {[0, 500, 1000, 2000].map(amount => (
                <button
                  key={amount}
                  onClick={() => setDonateAmount(amount)}
                  className="bg-gray-100 hover:bg-gray-200 p-2 rounded-lg transition text-sm"
                >
                  {amount === 0 ? 'Пропустить' : `${amount} Я`}
                </button>
              ))}
            </div>
            
            <div className="flex gap-3">
              <button
                onClick={handleDonate}
                className="flex-1 bg-red-500 text-white py-3 rounded-lg hover:bg-red-600 transition font-semibold"
              >
                ❤️ Пожертвовать
              </button>
            </div>
          </div>
        </div>
      )}

      {/* MODAL: SUPPORT - Поддержка */}
      {showSupport && (
        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
          <div className="bg-white rounded-lg max-w-2xl w-full max-h-[80vh] flex flex-col">
            <div className="p-4 border-b flex justify-between items-center">
              <h3 className="font-bold text-lg">💬 Поддержка</h3>
              <button 
                onClick={() => setShowSupport(false)} 
                className="text-gray-500 hover:text-gray-700"
              >
                <Icon name="x" />
              </button>
            </div>
            
            <div ref={supportRef} className="flex-1 overflow-y-auto p-4 space-y-3 bg-gray-50">
              {supportMessages.map((msg, i) => (
                <div 
                  key={i} 
                  className={`flex ${msg.sender_type === 'user' ? 'justify-end' : 'justify-start'}`}
                >
                  <div className={`max-w-xs rounded-lg p-3 ${
                    msg.sender_type === 'user' 
                      ? 'bg-green-600 text-white' 
                      : 'bg-blue-600 text-white'
                  }`}>
                    <p className="text-xs opacity-75 mb-1">
                      {msg.sender_type === 'user' ? 'Вы' : 'Поддержка'}
                    </p>
                    <p>{msg.text}</p>
                    <p className="text-xs opacity-75 mt-1">
                      {new Date(msg.created_at).toLocaleString('ru-RU')}
                    </p>
                  </div>
                </div>
              ))}
            </div>
            
            <div className="p-4 border-t flex gap-2">
              <input
                type="text"
                value={supportInput}
                onChange={(e) => setSupportInput(e.target.value)}
                onKeyPress={(e) => e.key === 'Enter' && sendSupportMsg()}
                placeholder="Опишите вашу проблему..."
                className="flex-1 p-3 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none"
              />
              <button 
                onClick={sendSupportMsg} 
                className="bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700 transition"
              >
                <Icon name="send" />
              </button>
            </div>
          </div>
        </div>
      )}
      
    </div>
  );
}

// ====================================================================================================
// РЕНДЕР ПРИЛОЖЕНИЯ
// ====================================================================================================

ReactDOM.createRoot(document.getElementById('root')).render(<TaskPlatform />);

</script>
</body>
</html>
